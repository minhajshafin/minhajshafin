<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 114" width="100%">
  <defs>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f8fa;
        --fg: #1f2328;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161b22;
          --fg: #e6edf3;
        }
      }
      .bg { fill: var(--bg); }
      .fg { fill: var(--fg); }
      .border {
        stroke: var(--fg);
        stroke-width: 1.5;
        fill: none;
      }
      .mono {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
        font-size: 14px;
        fill: var(--fg);
      }
    </style>

    <!-- Medium shade (▒) 50% terminal dither -->
    <pattern id="med-shade" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" x="0" y="0" class="fg" />
      <rect width="1" height="1" x="1" y="1" class="fg" />
    </pattern>

    <!-- Light shade (░) 25% terminal dither -->
    <pattern id="light-shade" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" x="0" y="0" class="fg" />
      <rect width="1" height="1" x="2" y="2" class="fg" />
    </pattern>
  </defs>

  <!-- GitHub <pre> background -->
  <rect width="840" height="114" rx="6" class="bg" />

  <!-- Crisp ASCII-style box borders (┌─── status ───┐, │, └───┘) -->
  <path class="border" d="
    M 130 34 V 27 H 384
    M 456 27 H 710 V 34
    M 130 40 V 56
    M 710 40 V 56
    M 130 60 V 76
    M 710 60 V 76
    M 130 80 V 87 H 710 V 80
  " />

  <!-- Row 1: Header -->
  <text x="420" y="32" text-anchor="middle" class="mono">status</text>

  <!-- Row 2: Status metrics (single line, non-breaking spaces) -->
  <text x="420" y="52" text-anchor="middle" class="mono">uptime: caffeinated  |  mode: shipping  |  bugs: in negotiations</text>

  <!-- Row 3: Life progress bar & labels (dead-center at x=420) -->
  <text x="310.8" y="72" text-anchor="end" class="mono">life:</text>
  <rect x="319.2" y="60" width="50.4" height="14" class="fg" />
  <rect x="369.6" y="60" width="16.8" height="14" fill="url(#med-shade)" />
  <rect x="386.4" y="60" width="151.2" height="14" fill="url(#light-shade)" />
  <text x="546.0" y="72" text-anchor="start" class="mono">25%</text>
</svg>
